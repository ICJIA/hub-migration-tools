# Nginx reverse proxy for Strapi 5
# Site: v2.hub.icjia-api.cloud → localhost:1337 (default Strapi 5 port)
#
# Add this to your Nginx site config:
#   /etc/nginx/sites-available/v2.hub.icjia-api.cloud
#
# Then: sudo ln -s /etc/nginx/sites-available/v2.hub.icjia-api.cloud /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name v2.hub.icjia-api.cloud;

    # Let's Encrypt certs (adjust paths if different)
    ssl_certificate /etc/letsencrypt/live/v2.hub.icjia-api.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2.hub.icjia-api.cloud/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeouts for large media uploads during migration
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 200M;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name v2.hub.icjia-api.cloud;
    return 301 https://$host$request_uri;
}
